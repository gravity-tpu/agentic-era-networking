project-includes = [
    "**/*.py*",
]

python-interpreter-path = ".venv/bin/python"

site-package-path = [
    ".venv/lib/python3.14/site-packages",
    "/Library/Frameworks/Python.framework/Versions/3.14/lib/python3.14/site-packages"
]

search-path = [
    "docs/design/jetson-orin",
    "scripts"
]

ignore-missing-imports = [
    "board",
    "busio",
    "adafruit_ssd1306",
    "pycoral",
    "pycoral.*",
    "tflite_runtime",
    "tflite_runtime.*"
]

replace-untyped-imports-with-any = [
    "psutil",
    "PIL",
    "PIL.*",
    "board",
    "busio",
    "adafruit_ssd1306"
]
