name: AI Code Review & Deploy

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: "true"
  GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY || secrets.GOOGLE_GENERATIVE_AI_API_KEY }}
  GOOGLE_GENERATIVE_AI_API_KEY: ${{ secrets.GOOGLE_GENERATIVE_AI_API_KEY || secrets.GEMINI_API_KEY }}
  ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
  OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}

on:
  workflow_dispatch:
  push:
    branches: [ "main", "feat/**" ]
    paths-ignore:
      - '**/*.md'
      - '.gitignore'
      - 'scratch/**'
      - '.env*'
  pull_request:
    branches: [ "main", "feat/**" ]
    paths-ignore:
      - '**/*.md'
      - '.gitignore'
      - 'scratch/**'
      - '.env*'

jobs:
  review:
    name: Technical Staff Council Review
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          fetch-depth: 0

      - name: Setup Node.js
        uses: actions/setup-node@1d0ff469b7ec7b3cb9d8673fde0c81c44821de2a # v4.2.0
        with:
          node-version-file: '.nvmrc'
          cache: 'npm'

      - name: Install Dependencies
        run: npm ci || npm install

      - name: Verify TypeScript Invariants (Zero Suppressions)
        run: npm run check-types

      - name: Build Project Artifacts
        run: npm run build

      - name: Run Invariant & Unit Test Suite
        run: npm run test

      - name: Technical Staff Council Review
        timeout-minutes: 12
        run: bash scripts/run-review.sh council:review:last "Technical Staff Council Review"
        env:
          GITHUB_BEFORE: ${{ github.event.before }}

  ccie-review:
    name: CCIE Network Engineering Council Review
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          fetch-depth: 0

      - name: Setup Node.js
        uses: actions/setup-node@1d0ff469b7ec7b3cb9d8673fde0c81c44821de2a # v4.2.0
        with:
          node-version-file: '.nvmrc'
          cache: 'npm'

      - name: Install Dependencies
        run: npm ci || npm install

      - name: CCIE Network Engineering Council Review
        timeout-minutes: 12
        run: bash scripts/run-review.sh ccie:review:last "CCIE Network Engineering Council Review"
        env:
          GITHUB_BEFORE: ${{ github.event.before }}

  deploy:
    name: Deploy to Vercel
    needs: [review, ccie-review]
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          fetch-depth: 1

      - name: Setup Node.js
        uses: actions/setup-node@1d0ff469b7ec7b3cb9d8673fde0c81c44821de2a # v4.2.0
        with:
          node-version-file: '.nvmrc'

      - name: Deploy to Vercel (Self-Skipping if Unconfigured)
        run: |
          set -euo pipefail
          if [ -z "${{ secrets.VERCEL_TOKEN }}" ] || [ -z "${{ secrets.VERCEL_PROJECT_ID || vars.VERCEL_PROJECT_ID }}" ]; then
            echo "::notice::VERCEL_TOKEN or VERCEL_PROJECT_ID secret/var not set — skipping deployment. Configure them in repository settings to enable production auto-deploy."
            exit 0
          fi
          npx vercel pull --yes --environment=production --token=${{ secrets.VERCEL_TOKEN }}
          npx vercel deploy --prod --yes --token=${{ secrets.VERCEL_TOKEN }}
        env:
          VERCEL_ORG_ID: ${{ secrets.VERCEL_ORG_ID || vars.VERCEL_ORG_ID }}
          VERCEL_PROJECT_ID: ${{ secrets.VERCEL_PROJECT_ID || vars.VERCEL_PROJECT_ID }}
