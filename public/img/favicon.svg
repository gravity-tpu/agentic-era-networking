<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 32 32" width="32" height="32">
  <rect width="32" height="32" fill="#0f1117"/>
  <!-- Satellite nodes -->
  <line x1="16" y1="16" x2="6"  y2="7"  stroke="#38bdf8" stroke-width="1.2" opacity="0.7"/>
  <line x1="16" y1="16" x2="27" y2="14" stroke="#38bdf8" stroke-width="1.2" opacity="0.7"/>
  <line x1="16" y1="16" x2="10" y2="26" stroke="#38bdf8" stroke-width="1.2" opacity="0.7"/>
  <!-- Glow halos -->
  <circle cx="6"  cy="7"  r="2.5" fill="#38bdf8" opacity="0.25"/>
  <circle cx="27" cy="14" r="2.5" fill="#38bdf8" opacity="0.25"/>
  <circle cx="10" cy="26" r="2.5" fill="#38bdf8" opacity="0.25"/>
  <!-- Satellite dots -->
  <circle cx="6"  cy="7"  r="1.8" fill="#7dd3fc"/>
  <circle cx="27" cy="14" r="1.8" fill="#7dd3fc"/>
  <circle cx="10" cy="26" r="1.8" fill="#7dd3fc"/>
  <!-- Central hub glow -->
  <circle cx="16" cy="16" r="5.5" fill="#38bdf8" opacity="0.2"/>
  <circle cx="16" cy="16" r="4"   fill="#38bdf8" opacity="0.35"/>
  <!-- Central hub -->
  <circle cx="16" cy="16" r="3"   fill="#38bdf8"/>
</svg>
